<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>HomeScreen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-frame">
<div class="mm-screen mm-phone">
<header class="mm-titlebar">
  <img class="mm-avatar" src="../../assets/logos/logo-mark.svg" alt="">
  <h1 class="mm-titlebar__title">Murali's Music App</h1>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon" aria-hidden="true">settings</span>Settings</button>
</header>
<div class="mm-screen__body">
  <button class="mm-btn mm-btn-primary mm-btn-hero"><span class="mm-btn__disc"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span></span><span class="mm-btn__text"><span class="mm-btn__sub">Continue</span>Kurai Ondrum Illai</span></button>
  <h2 class="mm-heading" style="padding-top:8px">My Lists</h2>
  <div class="mm-tiles"><button class="mm-tile"><span class="mm-icon is-filled" aria-hidden="true">favorite</span><span><span class="mm-tile__name">Favourites</span><br><span class="mm-tile__count">18 songs</span></span></button><button class="mm-tile"><span class="mm-icon is-filled" aria-hidden="true">library_music</span><span><span class="mm-tile__name">All Songs</span><br><span class="mm-tile__count">142 songs</span></span></button><button class="mm-tile"><span class="mm-icon" aria-hidden="true">history</span><span><span class="mm-tile__name">Recently Played</span><br><span class="mm-tile__count">50 songs</span></span></button><button class="mm-tile mm-tile-new"><span class="mm-icon" aria-hidden="true">add</span><span class="mm-tile__name">New List</span></button></div>
</div>
<div class="mm-nowbar mm-on-fill">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-nowbar__text"><div class="mm-nowbar__title">Kurai Ondrum Illai</div><div>M. S. Subbulakshmi</div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">pause</span>Pause</button>
  <div class="mm-nowbar__progress" aria-hidden="true"><span style="width:34%"></span></div>
</div>
<nav class="mm-tabbar" aria-label="Main">
  <button class="mm-tab" aria-current="page"><span class="mm-icon" aria-hidden="true">home</span>Home</button>
  <button class="mm-tab"><span class="mm-icon" aria-hidden="true">library_music</span>Songs</button>
  <button class="mm-tab"><span class="mm-icon" aria-hidden="true">add_circle</span>Add Song</button>
</nav>
</div>
</div>
</body>
</html>
