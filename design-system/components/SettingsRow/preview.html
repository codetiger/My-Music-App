<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>SettingsRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-settings mm-phone">
  <button class="mm-setting"><img class="mm-avatar" src="../../assets/logos/logo-mark.svg" alt=""><span class="mm-setting__text"><span class="mm-setting__name">Your Name and Photo</span><span>Murali</span></span><span class="mm-icon" aria-hidden="true">chevron_right</span></button>
  <button class="mm-setting"><span class="mm-setting__text"><span class="mm-setting__name">Text Size</span><span>Large</span></span><span class="mm-icon" aria-hidden="true">chevron_right</span></button>
  <button class="mm-setting"><span class="mm-setting__text"><span class="mm-setting__name">Default Playlist</span><span>Favourites</span></span><span class="mm-icon" aria-hidden="true">chevron_right</span></button>
  <button class="mm-setting"><span class="mm-setting__text"><span class="mm-setting__name">Storage</span><span>2.1 GB used · 3 removed</span></span><span class="mm-icon" aria-hidden="true">chevron_right</span></button>
  <button class="mm-setting"><span class="mm-setting__text"><span class="mm-setting__name">Phone Setup</span><span class="mm-status"><span class="mm-icon is-filled" aria-hidden="true">check_circle</span>All done</span></span><span class="mm-icon" aria-hidden="true">chevron_right</span></button>
</div>
</body>
</html>
