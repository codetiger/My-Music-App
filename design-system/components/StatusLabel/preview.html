<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>StatusLabel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <span class="mm-status"><span class="mm-icon" aria-hidden="true">offline_pin</span>On your phone</span>
  <span class="mm-status"><span class="mm-icon" aria-hidden="true">downloading</span>Downloading 40%</span>
  <span class="mm-status"><span class="mm-icon" aria-hidden="true">schedule</span>Will download later</span>
  <span class="mm-status mm-status-failed"><span class="mm-icon is-filled" aria-hidden="true">error</span>Can't be saved</span>
</div>
</body>
</html>
