<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>NowPlayingBar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-phone" style="padding-block:12px;display:flex;flex-direction:column;gap:12px">
<div class="mm-nowbar mm-on-fill">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-nowbar__text"><div class="mm-nowbar__title">Kurai Ondrum Illai</div><div>M. S. Subbulakshmi</div></div>
  <button class="mm-btn mm-btn-stacked mm-btn-primary"><span class="mm-icon is-filled" aria-hidden="true">pause</span>Pause</button>
  <div class="mm-nowbar__progress" aria-hidden="true"><span style="width:34%"></span></div>
</div>
<div class="mm-nowbar mm-on-fill">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-nowbar__text"><div class="mm-nowbar__title">Play Favourites</div><div>Nothing playing</div></div>
  <button class="mm-btn mm-btn-stacked mm-btn-primary"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span>Play</button>
</div>
<div class="mm-nowbar mm-on-fill">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-nowbar__text"><div class="mm-nowbar__title">Kurai Ondrum Illai</div><div>On a Back screen (Song, a list): Pause stays surface</div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">pause</span>Pause</button>
  <div class="mm-nowbar__progress" aria-hidden="true"><span style="width:34%"></span></div>
</div>
</div>
</body>
</html>
