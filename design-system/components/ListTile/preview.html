<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>ListTile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>

<body class="mm">
<div class="mm-pad mm-phone">
  <div class="mm-tiles">
    <button class="mm-tile"><span class="mm-icon is-filled" aria-hidden="true">favorite</span><span><span class="mm-tile__name">Favourites</span><br><span class="mm-tile__count">18 songs</span></span></button><button class="mm-tile"><span class="mm-icon is-filled" aria-hidden="true">library_music</span><span><span class="mm-tile__name">All Songs</span><br><span class="mm-tile__count">142 songs</span></span></button><button class="mm-tile"><span class="mm-icon" aria-hidden="true">history</span><span><span class="mm-tile__name">Recently Played</span><br><span class="mm-tile__count">50 songs</span></span></button><button class="mm-tile"><span class="mm-icon" aria-hidden="true">music_note</span><span><span class="mm-tile__name">Morning Bhajans</span><br><span class="mm-tile__count">12 songs</span></span></button><button class="mm-tile"><span class="mm-icon" aria-hidden="true">music_note</span><span><span class="mm-tile__name">Ilaiyaraaja</span><br><span class="mm-tile__count">No songs yet</span></span></button><button class="mm-tile mm-tile-new"><span class="mm-icon" aria-hidden="true">add</span><span class="mm-tile__name">New List</span></button>
  </div>
</div>
</body>
</html>
