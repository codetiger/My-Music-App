<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>SongRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-list mm-phone">
<div class="mm-song">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-song__text"><div class="mm-song__title">Kurai Ondrum Illai</div><div class="mm-song__meta"><span>M. S. Subbulakshmi</span><span><span class="mm-status"><span class="mm-icon" aria-hidden="true">offline_pin</span>On your phone</span></span></div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span>Play</button>
</div>
<div class="mm-song">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-song__text"><div class="mm-song__title">Ennai Konjam Maatri</div><div class="mm-song__meta"><span>Hariharan</span><span><span class="mm-status"><span class="mm-icon" aria-hidden="true">downloading</span>Downloading 40%</span></span></div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span>Play</button>
</div>
<div class="mm-song">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-song__text"><div class="mm-song__title">Voice note · 4 Oct</div><div class="mm-song__meta"><span><span class="mm-status"><span class="mm-icon" aria-hidden="true">schedule</span>Will download later</span></span></div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span>Play</button>
</div>
<div class="mm-song">
  <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
  <div class="mm-song__text"><div class="mm-song__title">Malarnthum Malaraatha</div><div class="mm-song__meta"><span>P. Susheela</span><span><span class="mm-status mm-status-failed"><span class="mm-icon is-filled" aria-hidden="true">error</span>Can't be saved</span></span></div></div>
  <button class="mm-btn mm-btn-stacked"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span>Play</button>
</div>
</div>
</body>
</html>
