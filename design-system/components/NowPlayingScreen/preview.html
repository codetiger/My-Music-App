<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>NowPlayingScreen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-frame">
<div class="mm-screen mm-phone">
<header class="mm-titlebar">
  <button class="mm-btn"><span class="mm-icon" aria-hidden="true">arrow_back</span>Back</button>
  <h1 class="mm-titlebar__title">Now Playing</h1>
</header>
<div class="mm-screen__body">
  <div class="mm-center">
    <div class="mm-art mm-art-hero" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
    <div class="mm-center" style="gap:4px;padding-top:16px"><h2 class="mm-title" style="font-size:28px;line-height:34px">Kurai Ondrum Illai</h2><div>M. S. Subbulakshmi</div></div>
  </div>
  <div class="mm-slider">
    <div class="mm-slider__rail"><div class="mm-slider__track"><div class="mm-slider__fill" style="width:33%"></div><div class="mm-slider__handle" style="left:33%"></div></div></div>
    <div class="mm-slider__times"><span>1:20</span><span>4:05</span></div>
  </div>
  <div class="mm-pair">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">replay_10</span>Back 10 s</button>
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">forward_10</span>Ahead 10 s</button>
  </div>
  <div class="mm-transport">
    <button class="mm-transport__btn"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">skip_previous</span></span>Previous</button>
    <button class="mm-transport__btn mm-transport__btn-main"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">pause</span></span>Pause</button>
    <button class="mm-transport__btn"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">skip_next</span></span>Next</button>
  </div>
  <div class="mm-pair">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">shuffle</span>Shuffle: Off</button>
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">repeat</span>Repeat: All</button>
  </div>
  <div class="mm-pair">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">queue_music</span>Up Next</button>
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">info</span>Song Details</button>
  </div>
  <div class="mm-volume"><span class="mm-label">Volume</span><span class="mm-icon" aria-hidden="true">volume_down</span><div class="mm-slider__rail"><div class="mm-slider__track"><div class="mm-slider__fill" style="width:60%"></div><div class="mm-slider__handle" style="left:60%"></div></div></div><span class="mm-icon" aria-hidden="true">volume_up</span></div>
</div>
</div>
</div>
</body>
</html>
