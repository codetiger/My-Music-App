<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <button class="mm-btn mm-btn-primary mm-btn-hero"><span class="mm-btn__disc"><span class="mm-icon is-filled" aria-hidden="true">play_arrow</span></span><span class="mm-btn__text"><span class="mm-btn__sub">Continue</span>Kurai Ondrum Illai</span></button>
  <div class="mm-row">
    <button class="mm-btn mm-btn-primary"><span class="mm-icon" aria-hidden="true">download</span>Save Song</button>
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">playlist_add</span>Add to List</button>
  </div>
  <div class="mm-row">
    <button class="mm-btn is-focused"><span class="mm-icon" aria-hidden="true">edit</span>Edit Name</button>
    <button class="mm-btn is-pressed"><span class="mm-icon" aria-hidden="true">favorite</span>Favourite</button>
  </div>
  <div class="mm-row">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">delete</span>Remove</button>
    <button class="mm-btn" aria-pressed="true"><span class="mm-icon" aria-hidden="true">shuffle</span>Shuffle: On</button>
  </div>
</div>
</body>
</html>
