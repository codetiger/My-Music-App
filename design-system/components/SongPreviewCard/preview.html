<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>SongPreviewCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <div class="mm-card mm-on-fill">
    <div class="mm-card__media">
      <div class="mm-art" aria-hidden="true"><span class="mm-icon" aria-hidden="true">music_note</span></div>
      <div class="mm-song__text"><div class="mm-song__title">Ennai Konjam Maatri</div><div>From YouTube · 4:05</div></div>
    </div>
    <button class="mm-btn mm-btn-primary mm-btn-block"><span class="mm-icon" aria-hidden="true">download</span>Save Song</button>
  </div>
  <div class="mm-label">2 songs found in this message</div>
  <div class="mm-card mm-on-fill">
    <div class="mm-card__media">
      <button class="mm-tick" role="checkbox" aria-checked="true" aria-label="Save this song"><span class="mm-tick__box"><span class="mm-icon" aria-hidden="true">check</span></span></button>
      <div class="mm-song__text"><div class="mm-song__title">Alaipayuthey Kanna</div><div>From Facebook · 6:12</div></div>
    </div>
  </div>
  <div class="mm-card mm-on-fill">
    <div class="mm-card__media">
      <button class="mm-tick" role="checkbox" aria-checked="false" aria-label="Save this song"><span class="mm-tick__box"></span></button>
      <div class="mm-song__text"><div class="mm-song__title">Voice note · 4 Oct</div><div>From WhatsApp · 0:48</div></div>
    </div>
  </div>
</div>
</body>
</html>
