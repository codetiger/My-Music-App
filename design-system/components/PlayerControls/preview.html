<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>PlayerControls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <div class="mm-pair">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">replay_10</span>Back 10 s</button>
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">forward_10</span>Ahead 10 s</button>
  </div>
  <div class="mm-transport">
    <button class="mm-transport__btn"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">skip_previous</span></span>Previous</button>
    <button class="mm-transport__btn mm-transport__btn-main"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">pause</span></span>Pause</button>
    <button class="mm-transport__btn"><span class="mm-transport__disc"><span class="mm-icon is-filled" aria-hidden="true">skip_next</span></span>Next</button>
  </div>
  <div class="mm-pair">
    <button class="mm-btn"><span class="mm-icon" aria-hidden="true">shuffle</span>Shuffle: Off</button>
    <button class="mm-btn" aria-pressed="true"><span class="mm-icon" aria-hidden="true">repeat</span>Repeat: All</button>
  </div>
</div>
</body>
</html>
