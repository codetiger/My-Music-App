<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>ConfirmDialog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-scrim">
  <div class="mm-dialog" role="dialog" aria-modal="true" aria-labelledby="q">
    <h2 class="mm-heading" id="q">Remove this song?</h2>
    <p>You can put it back from Recently Removed for 30 days.</p>
    <div class="mm-dialog__actions">
      <button class="mm-btn mm-btn-primary mm-btn-block"><span class="mm-icon" aria-hidden="true">delete</span>Remove</button>
      <button class="mm-btn mm-btn-block"><span class="mm-icon" aria-hidden="true">close</span>Cancel</button>
    </div>
  </div>
</div>
</body>
</html>
