<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>SearchField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <label class="mm-search"><span class="mm-icon" aria-hidden="true">search</span><input id="search-empty" type="search" placeholder="Type a song or singer" aria-label="Search songs"></label>
  <label class="mm-search mm-on-fill"><span class="mm-icon" aria-hidden="true">search</span><input id="search-filled" type="search" value="kanna" aria-label="Search songs"><button class="mm-btn mm-btn-stacked" style="min-height:56px"><span class="mm-icon" aria-hidden="true">close</span>Clear</button></label>
</div>
</body>
</html>
