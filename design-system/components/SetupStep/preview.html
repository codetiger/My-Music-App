<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>SetupStep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <div class="mm-label">Step 2 of 4</div>
  <h2 class="mm-title">Keep music playing</h2>
  <p>Set the battery to “No restrictions” so music keeps playing with the screen off.</p>
  <div class="mm-step__picture">
    <div class="mm-step__toggle"><span>No restrictions</span><span class="mm-switch" aria-hidden="true"></span></div>
    <span>Tap this on the next screen</span>
  </div>
  <button class="mm-btn mm-btn-primary mm-btn-block"><span class="mm-icon" aria-hidden="true">open_in_new</span>Open Settings</button>
  <button class="mm-btn mm-btn-block"><span class="mm-icon" aria-hidden="true">skip_next</span>Skip</button>
  <div class="mm-done"><span class="mm-icon is-filled" aria-hidden="true">check_circle</span>Done</div>
</div>
</body>
</html>
