<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<title>NoticeCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>html,body{margin:0;background:var(--surface);}</style>
</head>
<body class="mm">
<div class="mm-pad mm-phone">
  <div class="mm-card mm-on-fill">
    <div class="mm-card__head"><span class="mm-icon" aria-hidden="true">battery_alert</span><div><div class="mm-heading">Music may stop when the screen is off</div><p>One phone setting needs changing.</p></div></div>
    <div class="mm-card__actions"><button class="mm-btn"><span class="mm-icon" aria-hidden="true">settings</span>Finish Setup</button><button class="mm-btn">Not Now</button></div>
  </div>
  <div class="mm-card mm-on-fill">
    <div class="mm-card__head"><span class="mm-icon" aria-hidden="true">system_update</span><div class="mm-heading">A new version is ready</div></div>
    <div class="mm-card__actions"><button class="mm-btn"><span class="mm-icon" aria-hidden="true">install_mobile</span>Install</button></div>
  </div>
  <div class="mm-card mm-on-fill">
    <div class="mm-card__head"><img class="mm-avatar" src="../../assets/logos/logo-mark.svg" alt=""><div class="mm-heading">Put your picture on the home screen?</div></div>
    <div class="mm-card__actions"><button class="mm-btn"><span class="mm-icon" aria-hidden="true">add_to_home_screen</span>Add</button><button class="mm-btn">No Thanks</button></div>
  </div>
</div>
</body>
</html>
